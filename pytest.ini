[pytest]
testpaths = tests

# Default suite is intentionally offline and deterministic.
# Live/manual/legacy scripts stay in the repo, but are not collected by default.
python_files =
    test_config_contract.py
    test_critical_fixes.py
    test_completed_actions.py
    test_security_surface.py
    test_path_traversal.py
    test_cta_block_expiry.py
    test_name_validation.py
    test_url_safety.py
    test_docker_healthcheck.py
    test_completed_action_safety.py
    test_translation_safety.py
    test_openrouter_errors.py
    test_persistence_safety.py
    test_zhvanetsky.py
    test_language_surface.py
    test_english_heuristics.py
    test_router_security.py
    test_abuse_guard.py
    test_uk_cta_guards.py

addopts = --tb=short
