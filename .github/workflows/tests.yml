name: CI Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip packages
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-cov
    
    - name: Create .env file
      run: |
        echo "OPENROUTER_API_KEY=test_key_for_ci" > .env
        echo "DETERMINISTIC_MODE=true" >> .env
        echo "LOG_LEVEL=DEBUG" >> .env
    
    - name: Run offline tests
      run: python -m pytest
    
    - name: Test side-effect-free imports
      run: |
        PYTHONPATH=src PERSISTENCE_BASE_PATH=/tmp/ukido_ci_persistent_states python -c "from src.main import app; print('✅ Main app imports successfully')"
        PYTHONPATH=src python -c "from src.router import Router; print('✅ Router imports successfully')"
        PYTHONPATH=src python -c "from src.response_generator import ResponseGenerator; print('✅ ResponseGenerator imports successfully')"
    
    - name: Lint with basic checks
      run: |
        # Basic Python syntax check
        python -m py_compile src/*.py
        echo "✅ All Python files compile successfully"

  docker:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Build Docker image
      run: |
        docker build -t ukido-test .
        echo "✅ Docker image built successfully"
    
    - name: Test Docker image
      run: |
        docker run --rm ukido-test python -c "print('✅ Docker container runs successfully')"

  deploy:
    name: Deploy to Beyond Horizon
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, docker]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: ukido-production
      cancel-in-progress: false

    steps:
    - uses: actions/checkout@v7

    - name: Configure deployment SSH
      env:
        DEPLOY_KEY: ${{ secrets.BH_DEPLOY_KEY }}
        KNOWN_HOSTS: ${{ secrets.BH_KNOWN_HOSTS }}
      run: |
        install -d -m 700 ~/.ssh
        printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
        printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
        chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

    - name: Upload candidate release
      env:
        DEPLOY_HOST: ${{ secrets.BH_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.BH_DEPLOY_USER }}
      run: |
        ssh "$DEPLOY_USER@$DEPLOY_HOST" 'rm -rf /srv/bh/ukido/app.next && mkdir -p /srv/bh/ukido/app.next'
        rsync -az --delete \
          --exclude='.git/' \
          --exclude='.env' \
          --exclude='.venv/' \
          --exclude='data/persistent_states/' \
          ./ "$DEPLOY_USER@$DEPLOY_HOST:/srv/bh/ukido/app.next/"

    - name: Activate and verify release
      env:
        DEPLOY_HOST: ${{ secrets.BH_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.BH_DEPLOY_USER }}
      run: |
        ssh "$DEPLOY_USER@$DEPLOY_HOST" "bash /srv/bh/ukido/app.next/ops/activate-release.sh '$GITHUB_SHA'"

    - name: Verify public HTTPS
      run: |
        for attempt in {1..10}; do
          if curl --fail --silent --show-error https://ukido.beyondhorizon.dev/health; then
            exit 0
          fi
          sleep 3
        done
        exit 1
